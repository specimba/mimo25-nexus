[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus25"
version = "0.1.0"
description = "NEXUS OS — Unified agent platform with governance, provider routing, and multi-platform gateway"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
full = ["httpx>=0.27", "rich>=13.0"]

[project.scripts]
nexus25 = "nexus25.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
